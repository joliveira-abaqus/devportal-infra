# Override para desenvolvimento local
# Configurações adicionais de debug e logging verboso
services:
  mongodb:
    ports:
      - "27017:27017"
    command: ["mongod", "--setParameter", "diagnosticDataCollectionEnabled=false"]

  redis:
    ports:
      - "6379:6379"
    command: ["redis-server", "--loglevel", "verbose"]

  localstack:
    environment:
      DEBUG: 1
      LS_LOG: trace
