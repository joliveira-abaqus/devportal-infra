services:
  postgres:
    image: postgres:16-alpine
    container_name: devportal-postgres
    environment:
      POSTGRES_USER: devportal
      POSTGRES_PASSWORD: devportal
      POSTGRES_DB: devportal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devportal -d devportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devportal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.0
    container_name: devportal-localstack
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
      LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: 1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
